<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color Picker by Evans Large</title>
<style>
:root{--bg:#14171c;--panel:#1d2128;--raised:#252a33;--line:#323945;--ink:#eef1f6;--soft:#9aa4b2;--accent:#ff5b52;--ok:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
h1{margin:0 0 2px;font-size:1.05rem}
.sub{color:var(--soft);font-size:.8rem;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:8px 12px}
button:hover{border-color:var(--accent)}
.pick{width:100%;background:var(--accent);border-color:var(--accent);color:#161616;font-weight:700;padding:13px;font-size:1rem}
.pick:disabled{opacity:.5;cursor:not-allowed}
.hint{color:var(--soft);font-size:.78rem;text-align:center;margin:6px 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--soft)}
.cur{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.sw{width:64px;height:64px;border-radius:14px;border:1px solid var(--line);flex:none;background:#888}
.hexbig{font:700 1.4rem ui-monospace,Consolas,monospace}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.row b{width:48px;color:var(--soft);font-size:.74rem;text-transform:uppercase}
.row code{flex:1;font:.86rem ui-monospace,Consolas,monospace}
.row button{padding:4px 10px;font-size:.78rem}
.ct{display:flex;gap:8px;margin-top:10px}
.ct div{flex:1;border-radius:10px;padding:8px;text-align:center;font-size:.78rem;border:1px solid var(--line)}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.h{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);cursor:pointer;position:relative}
.h.on{border-color:var(--ink)}
.empty{color:var(--soft);font-size:.84rem}
.notice{background:#3a2a12;border:1px solid #7a5a1c;color:#ffd58a;border-radius:10px;padding:10px;margin-bottom:12px;font-size:.82rem}
.toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#000;border:1px solid var(--ok);padding:7px 14px;border-radius:99px;font-size:.84rem}
.hide{display:none}
</style>
</head>
<body>
<h1>Color Picker by Evans Large</h1>
<div class="sub">Pick any color on your screen, even outside the browser.</div>
<div id="notice" class="notice hide"></div>
<button class="pick" id="pick" type="button">Pick a color from the screen</button>
<p class="hint">After you press it, move over any window or app and click. Esc cancels.</p>
<div class="card">
  <h2>Selected color</h2>
  <div class="cur"><div class="sw" id="sw"></div><div><div class="hexbig" id="hexbig">No color yet</div></div></div>
  <div id="rows"></div>
  <div class="ct" id="ct"></div>
</div>
<div class="card">
  <h2>Recent colors</h2>
  <div class="hist" id="hist"></div>
  <p class="empty" id="empty">Colors you pick are kept here.</p>
  <div style="margin-top:10px"><button type="button" id="clear" class="hide">Clear the list</button></div>
</div>
<div id="toast" class="toast hide"></div>
<script src="color.js"></script>
<script src="picker.js"></script>
</body>
</html>
