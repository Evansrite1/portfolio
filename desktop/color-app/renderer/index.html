<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Color Picker by Evans Large</title>
<style>
:root{--bg:#14171c;--panel:#1d2128;--raised:#252a33;--line:#323945;--ink:#eef1f6;--soft:#9aa4b2;--accent:#ff5b52;--ok:#3ddc84}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;user-select:none}
header{padding:16px 18px 10px}
h1{margin:0;font-size:1.05rem}
.sub{color:var(--soft);font-size:.8rem;margin-top:2px}
.main{padding:0 18px 12px;overflow:auto;flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:8px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{width:100%;background:var(--accent);border-color:var(--accent);color:#161616;font-weight:700;padding:13px;font-size:1rem;margin:6px 0 4px}
.hint{color:var(--soft);font-size:.78rem;text-align:center;margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--soft)}
.cur{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.sw{width:72px;height:72px;border-radius:14px;border:1px solid var(--line);flex:none;background:#888}
.hexbig{font:700 1.5rem ui-monospace,Consolas,monospace}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.row b{width:48px;color:var(--soft);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.row code{flex:1;font:.86rem ui-monospace,Consolas,monospace;user-select:text}
.row button{padding:4px 10px;font-size:.78rem}
.ct{display:flex;gap:8px;margin-top:10px}
.ct div{flex:1;border-radius:10px;padding:8px;text-align:center;font-size:.78rem;border:1px solid var(--line)}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.h{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);cursor:pointer;position:relative}
.h.on{border-color:var(--ink)}
.h:hover .x{display:block}
.x{display:none;position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#000;color:#fff;border:1px solid var(--line);font-size:11px;line-height:16px;text-align:center;padding:0}
.opt{display:flex;gap:8px;align-items:center;color:var(--soft);font-size:.82rem;margin-top:6px}
.notice{background:#3a2a12;border:1px solid #7a5a1c;color:#ffd58a;border-radius:10px;padding:10px;margin-bottom:12px;font-size:.82rem}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000;border:1px solid var(--ok);padding:8px 16px;border-radius:99px;font-size:.84rem}
.hide{display:none}
.empty{color:var(--soft);font-size:.84rem}
</style>
</head>
<body>
<header><h1>Color Picker by Evans Large</h1><div class="sub">Pick any color on your screen, in any app, window or video.</div></header>
<div class="main">
  <div id="notice" class="notice hide" role="alert"></div>
  <button class="pick" id="pick" type="button">Pick a color from the screen</button>
  <p class="hint">Or press <b id="key">Ctrl+Alt+C</b> from anywhere. Click a pixel to pick it. Esc cancels.</p>
  <div class="card" id="cur-card">
    <h2>Selected color</h2>
    <div class="cur"><div class="sw" id="sw"></div><div><div class="hexbig" id="hexbig">No color yet</div><div class="sub" id="name">Press the button above</div></div></div>
    <div id="rows"></div>
    <div class="ct" id="ct"></div>
  </div>
  <div class="card">
    <h2>Recent colors</h2>
    <div class="hist" id="hist"></div>
    <p class="empty" id="empty">Colors you pick are kept here.</p>
    <div class="opt"><label><input type="checkbox" id="auto"> Copy the HEX code when I pick</label></div>
    <div style="margin-top:10px"><button type="button" id="clear" class="hide">Clear the list</button></div>
  </div>
</div>
<div id="toast" class="toast hide" role="status"></div>
<script src="color.js"></script>
<script src="app.js"></script>
</body>
</html>
