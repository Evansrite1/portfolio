<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Pick a color</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:crosshair}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#loupe{position:fixed;width:150px;height:150px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #000,0 6px 24px rgba(0,0,0,.6);pointer-events:none;display:none;overflow:hidden}
#loupe canvas{position:static;width:150px;height:150px;image-rendering:pixelated}
#tag{position:fixed;pointer-events:none;display:none;background:#000;color:#fff;font:600 13px ui-monospace,Consolas,monospace;padding:4px 8px;border-radius:6px;border:1px solid #fff;white-space:nowrap}
#msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font:13px system-ui,sans-serif;padding:8px 16px;border-radius:99px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loupe"><canvas id="lc" width="150" height="150"></canvas></div>
<div id="tag"></div>
<div id="msg">Click a color. Arrow keys move one pixel. Esc to cancel.</div>
<script src="color.js"></script>
<script src="overlay.js"></script>
</body>
</html>
