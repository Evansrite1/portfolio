<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Editor</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
:root{--bg:#0b0b0c;--p1:#141416;--p2:#1c1c20;--p3:#26262b;--line:#2d2d33;--ink:#f4f4f5;--soft:#b8b8c0;--faint:#7e7e87;--acc:#ff5b52;--v:#3b82f6;--o:#a855f7;--t:#f59e0b;--c:#ec4899;--a:#10b981;--sa:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.note{background:#2a1a19;color:#ffb4ae;font-size:.74rem;padding:5px 12px;text-align:center;border-bottom:1px solid #4a2a28}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--p1);border-bottom:1px solid var(--line)}
.top .back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);text-decoration:none}
.top input{flex:1;min-width:0;background:transparent;border:1px solid transparent;color:var(--ink);font:inherit;font-weight:600;padding:7px 9px;border-radius:9px}
.top input:hover,.top input:focus{border-color:var(--line);outline:none}
.exp{background:var(--acc);color:#1a0b0a;border:0;border-radius:999px;padding:9px 20px;font-weight:700}
.exp:disabled{opacity:.4}

/* body */
.body{flex:1;display:flex;min-height:0}
.stagearea{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.stagewrap{flex:1;display:grid;place-items:center;padding:12px;min-height:0;position:relative}
.stage{position:relative;aspect-ratio:16/9;max-height:100%;max-width:100%;width:100%;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 10px 36px rgba(0,0,0,.55);transition:aspect-ratio .25s}
.stage.tall{width:auto;height:100%}
.scene{position:absolute;inset:0;transition:filter .12s}
.layer{position:absolute;inset:0;transition:transform .1s,opacity .1s}
.sun{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff6c9,#ffc857 60%,transparent 62%);left:62%;top:16%}
.hill{position:absolute;left:-10%;right:-10%;bottom:-8%;height:38%;border-radius:50% 50% 0 0}
.ov{position:absolute;pointer-events:none}
.ovtext{left:50%;top:44%;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(16px,5vw,52px);color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap}
.ovcap{left:50%;bottom:8%;transform:translateX(-50%);font-weight:700;font-size:clamp(11px,2.6vw,24px);background:rgba(0,0,0,.62);color:#fff;padding:.15em .6em;border-radius:.4em;max-width:88%;text-align:center}
.ovstk{right:7%;top:9%;width:1.5em;height:1.5em;border-radius:50%;background:#ffd23f;display:grid;place-items:center;color:#1a1a1a;font-weight:900;font-size:clamp(16px,4vw,38px)}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.8));opacity:0}
.empty{position:absolute;inset:12px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border:2px dashed #3a3a41;border-radius:14px;background:var(--bg);z-index:5;padding:20px}
.empty h2{margin:0;font-size:1.3rem}
.empty p{margin:0;color:var(--soft);font-size:.9rem;max-width:30ch}
.empty .big{background:var(--acc);color:#1a0b0a;border:0;border-radius:14px;padding:14px 26px;font-weight:700;font-size:1.02rem;display:flex;gap:10px;align-items:center}
.empty .lnk{background:none;border:0;color:var(--soft);text-decoration:underline;font-size:.88rem}
.app.blank .empty{display:flex}
.app.blank .tl,.app.blank .transport{display:none}
.transport{display:flex;align-items:center;justify-content:center;gap:12px;padding:2px 12px 8px}
.transport .time{font:600 .84rem ui-monospace,Consolas,monospace;color:var(--soft);min-width:112px;text-align:center}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--p2);display:grid;place-items:center}
.ic svg{width:18px;height:18px;fill:currentColor;stroke:none}
.ic.play{width:50px;height:50px;background:var(--ink);color:#111;border:0}

/* sheet (right panel on desktop, bottom sheet on phone) */
.sheet{display:none;width:340px;background:var(--p1);border-left:1px solid var(--line);flex-direction:column;min-height:0}
.app.open .sheet{display:flex}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;font-size:1rem}
.sh-head button{background:var(--p3);border:0;border-radius:999px;padding:7px 16px;font-weight:600;font-size:.86rem}
.sh-body{padding:14px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sh-body h4{margin:16px 0 8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.sh-body h4:first-child{margin-top:0}
.hint{color:var(--soft);font-size:.84rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;font-size:.84rem;min-height:56px;display:grid;place-items:center}
.card:active,.card:hover{border-color:var(--acc)}
.card[aria-pressed=true]{outline:2px solid var(--acc);border-color:transparent}
.thumb{aspect-ratio:16/10;border-radius:10px;border:1px solid var(--line);position:relative;cursor:pointer}
.thumb span{position:absolute;left:5px;bottom:4px;font-size:.66rem;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:5px}
.btn{background:var(--p3);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:8px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a0b0a}
.row{margin-bottom:16px}
.row label{display:flex;justify-content:space-between;font-size:.84rem;color:var(--soft);margin-bottom:6px}
.row label b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;height:28px;accent-color:var(--acc);margin:0}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:.8rem;color:var(--soft);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--p2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:.9rem}
.tog small{display:block;color:var(--faint);font-size:.76rem}
.sw{width:46px;height:28px;background:#3a3a41;border-radius:99px;position:relative;flex:none;border:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-checked=true]{background:var(--acc)}
.sw[aria-checked=true]::after{left:21px}
.orig{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:4px 12px;font-size:.84rem}
.orig div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.orig div:last-child{border:0}
.orig span{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{background:var(--p2);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:.84rem;color:var(--soft)}
.chip[aria-pressed=true]{background:var(--ink);color:#111;border-color:var(--ink)}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px;cursor:pointer;font-size:.9rem}
.item small{color:var(--faint)}

/* timeline */
.tl{background:var(--p1);border-top:1px solid var(--line)}
.acts{display:flex;align-items:center;gap:4px;padding:6px 8px;overflow-x:auto;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{background:none;border:0;border-radius:10px;padding:5px 11px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;color:var(--soft);flex:none}
.act svg{width:20px;height:20px}
.act:disabled{opacity:.3}
.act:not(:disabled):active{background:var(--p3)}
.acts .sp{flex:1}
.scroll{overflow:auto;position:relative;max-height:34vh;-webkit-overflow-scrolling:touch}
.canvas{position:relative;padding-bottom:6px}
.ruler{height:24px;position:sticky;top:0;background:var(--p1);z-index:3;border-bottom:1px solid var(--line)}
.ruler span{position:absolute;top:5px;font-size:.64rem;color:var(--faint);transform:translateX(3px)}
.lane{height:42px;position:relative;margin-top:3px}
.clip{position:absolute;top:2px;height:38px;border-radius:9px;padding:0 9px;display:flex;align-items:center;font-size:.76rem;font-weight:600;overflow:hidden;white-space:nowrap;border:2px solid transparent;user-select:none;color:#fff}
.clip.sel{border-color:#fff}
.clip.v{background:linear-gradient(90deg,#1e4fa8,#3b82f6)}
.clip.o{background:linear-gradient(90deg,#7a2fb0,#a855f7)}
.clip.t{background:linear-gradient(90deg,#b36a05,#f59e0b)}
.clip.c{background:linear-gradient(90deg,#b0246f,#ec4899)}
.clip.a{background:linear-gradient(90deg,#0b7a58,#10b981)}
.clip .wv{position:absolute;inset:0;opacity:.3;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 5px)}
.clip .lb{position:relative}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);z-index:4;pointer-events:none}
.ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:10px solid var(--acc);border-bottom:0}

/* toolbar */
.toolbar{display:flex;gap:2px;padding:6px 8px calc(6px + var(--sa));background:var(--bg);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;justify-content:center}
.toolbar::-webkit-scrollbar{display:none}
.tb{background:none;border:0;border-radius:12px;padding:8px 10px;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--soft);flex:none}
.tb[aria-pressed=true]{background:var(--p3);color:var(--ink)}
.tb:disabled{opacity:.3}
.tb:not(:disabled):active{background:var(--p3)}

/* modal and toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:30}
.modal.on{display:flex}
.mbox{background:var(--p1);border:1px solid var(--line);border-radius:18px;width:min(440px,94vw);padding:20px;max-height:92dvh;overflow:auto}
.mbox h2{margin:0 0 4px;font-size:1.2rem}
.mbox p{margin:0 0 14px;color:var(--soft);font-size:.86rem}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;width:100%;text-align:left}
.opt[aria-pressed=true]{outline:2px solid var(--acc);border-color:transparent}
.opt small{display:block;color:var(--faint);font-size:.78rem}
.bar{height:10px;background:var(--p3);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.bar span{display:block;height:100%;width:0;background:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sa));transform:translate(-50%,16px);background:#fff;color:#111;font-weight:600;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:40;font-size:.84rem;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* phone: the sheet becomes a bottom sheet and replaces the toolbar */
@media (max-width:820px){
  .note{font-size:.68rem}
  .body{flex-direction:column}
  .sheet{width:100%;height:46dvh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;order:3;flex:none}
  .app.open .tl,.app.open .toolbar{display:none}
  .scroll{max-height:24vh}
  .stagewrap{padding:8px}
  .tb{min-width:58px;padding:7px 6px}
  .toolbar{justify-content:flex-start}
  .exp{padding:9px 16px}
  .mbox{align-self:flex-end;width:100%;max-width:none;border-radius:20px 20px 0 0;padding-bottom:calc(20px + var(--sa))}
  .modal{align-items:flex-end}
}
@media (min-width:821px){
  .scroll{max-height:200px}
}

canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.note{display:none}
.act.on{color:var(--ink)}
.clip{background-size:cover;background-position:center}
.clip .hd{position:absolute;top:0;bottom:0;width:16px;background:#fff;opacity:.95;display:grid;place-items:center;z-index:2;touch-action:none;cursor:ew-resize}
.clip .hd::after{content:"";width:2px;height:14px;background:#555;border-radius:2px}
.clip .hd.l{left:0;border-radius:8px 0 0 8px}
.clip .hd.r{right:0;border-radius:0 8px 8px 0}
.clip.sel.free{touch-action:none;cursor:grab}
.clip.sel .lb{padding:0 16px}
.dropzone{outline:3px dashed var(--acc);outline-offset:-10px}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.lib .thumb{background-size:cover;background-position:center;background-color:var(--p3);display:grid;place-items:center}
.lib .thumb .k{position:absolute;right:5px;top:4px;font-size:.6rem;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:5px}
.err{color:#ff9d96;font-size:.84rem;margin:8px 0}
.dl{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--acc);color:#1a0b0a;font-weight:700;border-radius:14px;padding:14px;text-decoration:none;margin-bottom:8px}
.stage video{display:none}
.opt.dis{opacity:.5}

.bar span.ind{width:40%;animation:ind 1.1s ease-in-out infinite alternate}
@keyframes ind{from{margin-left:0}to{margin-left:60%}}
.caplist{display:grid;gap:8px;margin-bottom:12px}
.capline{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:8px}
.capline.on{border-color:var(--acc)}
.capline textarea{background:var(--p1);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:.9rem;resize:vertical;min-height:46px;width:100%}
.capline textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.cptime{background:var(--p3);border:0;border-radius:8px;padding:7px 9px;font:600 .74rem ui-monospace,Consolas,monospace;color:var(--soft)}
.cpdel{background:none;border:0;width:34px;height:34px;border-radius:9px;color:var(--faint);display:grid;place-items:center}
.cpdel:hover{background:var(--p3);color:var(--ink)}
.cpdel svg{width:16px;height:16px}
.hb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--p2);font-weight:700;font-size:1rem}
.hb:hover{border-color:var(--acc)}
.steps3{display:flex;gap:10px;margin-top:6px}
.steps3 div{flex:1;background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:11px 8px;font-weight:600;font-size:.9rem;min-width:84px}
.steps3 b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#1a0b0a;font-size:.78rem;margin:0 auto 6px}
.steps3 small{display:block;color:var(--faint);font-weight:400;font-size:.72rem;margin-top:2px}
.empty .lnk#howlink{color:var(--ink)}
.howlist{display:grid;gap:9px;margin-bottom:12px}
.how{display:flex;gap:12px;align-items:flex-start;background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:.88rem;color:var(--soft)}
.how b{color:var(--ink)}
.hn{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#1a0b0a;font-weight:700;font-size:.8rem}
.tips{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:.84rem;color:var(--soft)}
.tips ul{margin:6px 0 0;padding-left:18px}
.tips li{margin-bottom:3px}
.tour{position:fixed;inset:0;z-index:60}
.tr-spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.74),0 0 0 2px var(--acc);transition:all .3s ease;pointer-events:none;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9999px rgba(0,0,0,.74),0 0 0 5px rgba(255,91,82,.55)}}
.tr-tip{position:fixed;background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.6);transition:top .3s ease,left .3s ease}
.tr-tip h3{margin:2px 0 6px;font-size:1.05rem}
.tr-tip p{margin:0 0 12px;color:var(--soft);font-size:.9rem}
.tr-n{font-size:.7rem;color:var(--acc);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.tr-dots{display:flex;gap:5px;margin-bottom:12px}
.tr-dots i{width:7px;height:7px;border-radius:50%;background:#3a3a41}
.tr-dots i.on{background:var(--acc);width:18px;border-radius:4px}
.tr-btns{display:flex;gap:8px;align-items:center}
.tr-btns button{border-radius:10px;padding:10px 16px;font-weight:600;border:1px solid var(--line);background:var(--p3)}
.tr-btns .tr-skip{margin-right:auto;border:0;background:none;color:var(--faint);padding-left:0}
.tr-btns .tr-next{background:var(--acc);border-color:var(--acc);color:#1a0b0a}
.welcome{position:fixed;left:50%;bottom:calc(100px + var(--sa));transform:translateX(-50%);background:var(--p1);border:1px solid var(--acc);border-radius:16px;padding:14px 16px;z-index:35;display:flex;flex-direction:column;gap:3px;width:min(340px,92vw);box-shadow:0 12px 36px rgba(0,0,0,.55);animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px)}}
.welcome span{color:var(--soft);font-size:.88rem}
.welcome div{display:flex;gap:8px;margin-top:8px}
.welcome button{flex:1;border-radius:10px;padding:10px;border:1px solid var(--line);background:var(--p3);font-weight:600}
.welcome button.pri{background:var(--acc);border-color:var(--acc);color:#1a0b0a}
@media (max-width:820px){.steps3 div{min-width:0}.empty{gap:10px;padding:14px}}
</style>
</head>
<body>
<div class="app blank" id="app">
  <header class="top">
    <a class="back" href="/tools/video-editor/" aria-label="Back to the video editor page"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
    <input id="pname" value="My video" aria-label="Project name">
    <button class="hb" id="help" aria-label="How to use">?</button>
    <button class="exp" id="exportBtn" disabled>Export</button>
  </header>

  <div class="body">
    <section class="stagearea">
      <div class="stagewrap" id="stagewrap">
        <div class="stage" id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
        <div class="empty" id="empty">
          <h2>Make a video</h2>
          <p>Add a video, photos or music from your device. It stays on your device and is never uploaded.</p>
          <button class="big" id="addFirst"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add your video</button>
          <button class="lnk" id="dropHint" disabled style="text-decoration:none">or drop files here</button>
          <div class="steps3"><div><b>1</b>Add<small>video, photos, music</small></div><div><b>2</b>Edit<small>cut, text, captions</small></div><div><b>3</b>Export<small>save your MP4</small></div></div>
          <button class="lnk" id="howlink">How does it work?</button>
        </div>
      </div>
      <div class="transport">
        <button class="ic" id="toStart" aria-label="Back to start"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ic play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="ic" id="toEnd" aria-label="Go to end"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
        <span class="time" id="time">0:00 / 0:00</span>
      </div>
    </section>
    <aside class="sheet" id="sheet" aria-live="polite">
      <div class="sh-head"><h3 id="shTitle"></h3><button id="shDone">Done</button></div>
      <div class="sh-body" id="shBody"></div>
    </aside>
  </div>

  <section class="tl">
    <div class="acts" id="acts">
