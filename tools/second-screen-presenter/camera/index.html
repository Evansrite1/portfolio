<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Phone camera for the Presenter</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0b0910; color: #f2eef6; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100svh; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  h1 { font-size: 1.15rem; margin: 18px 0 2px; } p { margin: 0; color: #b9aec4; font-size: .92rem; }
  .stage { position: relative; margin: 14px 0; border-radius: 22px; overflow: hidden; background: #000; display: grid; place-items: center; min-height: 52svh; }
  video { width: 100%; height: 100%; object-fit: cover; display: none; }
  .stage.on video { display: block; }
  .hint { padding: 24px; text-align: center; color: #b9aec4; }
  .stage.on .hint { display: none; }
  .pill { position: absolute; left: 12px; top: 12px; padding: 7px 14px; border-radius: 999px; background: rgba(0,0,0,.6); font-size: .82rem; display: none; }
  .stage.on .pill { display: block; }
  .live { color: #6ee7a0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 0 16px; }
  button { font: inherit; font-weight: 600; padding: 16px; border-radius: 16px; border: 0; background: #ff5b52; color: #190d10; cursor: pointer; }
  button.alt { background: #2a2233; color: #f2eef6; }
  button:disabled { opacity: .5; }
  button.wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<header><h1>Phone camera</h1><p id="st">Press Start camera. Your picture appears in the Presenter on the computer.</p></header>
<div class="stage" id="stage"><video id="v" playsinline muted autoplay></video><span class="pill" id="pill">Starting...</span><div class="hint">Your camera picture will show here.</div></div>
<div class="row">
  <button id="start" class="wide" type="button">Start camera</button>
  <button id="flip" class="alt" type="button" disabled>Flip camera</button>
  <button id="stop" class="alt" type="button" disabled>Stop</button>
</div>
<script src="/tools/vendor/peerjs/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var target = (location.hash || '').replace('#', ''), stream = null, peer = null, call = null, facing = 'environment', wake = null, tries = 0;
  var ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }, { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }];
  function status(t, live) { $('st').textContent = t; $('pill').textContent = live ? 'Live on the screen computer' : t; $('pill').className = 'pill' + (live ? ' live' : ''); }
  function open(f) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { status('This browser cannot use the camera. Open the link in Safari or Chrome.'); return Promise.reject(); }
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: f }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }).then(function (s) {
      stream = s; $('v').srcObject = s; $('stage').classList.add('on'); return s;
    });
  }
  function link() {
    if (!target) { status('Open this page by scanning the code in the Presenter.'); return; }
    if (!window.Peer) { status('Could not load. Check your internet connection.'); return; }
    if (peer && !peer.destroyed) { try { peer.destroy(); } catch (e) {} }
    peer = new window.Peer({ debug: 0, config: { iceServers: ICE, iceCandidatePoolSize: 4 } });
    peer.on('error', function () { status('Connection problem. Trying again...'); retry(); });
    peer.on('open', function () {
      call = peer.call(target, stream);
      if (!call) { status('Could not reach the Presenter. Keep it open and scan again.'); return; }
      call.on('close', function () { status('Disconnected. Reconnecting...'); retry(); });
      call.on('error', function () { retry(); });
      var n = 0, iv = setInterval(function () { var pc = call && call.peerConnection; if (pc && (pc.connectionState === 'connected' || pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed')) { clearInterval(iv); tries = 0; status('Connected.', true); } else if (++n > 40) clearInterval(iv); }, 300);
    });
  }
  function retry() { if (tries++ > 15 || !stream) return; setTimeout(link, Math.min(6000, 800 * tries)); }
  $('start').onclick = function () {
    $('start').disabled = true; status('Allow the camera when your phone asks.');
    open(facing).then(function () {
      $('flip').disabled = false; $('stop').disabled = false; $('start').textContent = 'Camera is on'; status('Connecting...'); link();
      if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {});
    }).catch(function () { $('start').disabled = false; status('The camera did not start. Allow camera access for this page and try again.'); });
  };
  $('flip').onclick = function () {
    facing = facing === 'environment' ? 'user' : 'environment';
    open(facing).then(function (s) { var sender = call && call.peerConnection && call.peerConnection.getSenders().filter(function (x) { return x.track && x.track.kind === 'video'; })[0]; if (sender) sender.replaceTrack(s.getVideoTracks()[0]); });
  };
  $('stop').onclick = function () {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; if (peer) { try { peer.destroy(); } catch (e) {} } if (wake) { try { wake.release(); } catch (e) {} }
    $('stage').classList.remove('on'); $('start').disabled = false; $('start').textContent = 'Start camera'; $('flip').disabled = true; $('stop').disabled = true; status('Stopped.');
  };
})();
</script>
</body>
</html>
