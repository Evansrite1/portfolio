name: Presenter app

# Builds the Windows installer and the Mac app and attaches them to a GitHub release.
# Start it by pushing a tag such as v1.0.0 (the tag must match "version" in desktop/presenter-app/package.json),
# or run it by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: release:win
          - os: macos-latest
            script: release:mac:arm64
          - os: macos-latest
            script: release:mac:x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/presenter-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/presenter-app/package-lock.json
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
        working-directory: .
      - run: npm ci
      - name: Build (the Mac disk image step fails now and then, so it is tried up to four times)
        shell: bash
        run: |
          for i in 1 2 3 4; do
            rm -rf dist
            if npm run ${{ matrix.script }}; then exit 0; fi
            echo "Attempt $i failed, trying again"; sleep 10
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
