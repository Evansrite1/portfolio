name: Presenter app

# Builds the Windows installer and the Mac app and attaches them to a GitHub release.
# Start it by pushing a tag such as v1.0.0 (the tag must match "version" in desktop/presenter-app/package.json),
# or run it by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: release:win
          - os: macos-latest
            script: release:mac:arm64
          - os: macos-15-intel
            script: release:mac:x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/presenter-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/presenter-app/package-lock.json
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
        working-directory: .
      - run: npm ci
      - name: Build (the Mac disk image step fails now and then, so it is tried up to four times)
        shell: bash
        run: |
          for i in 1 2 3 4; do
            rm -rf dist
            if npm run ${{ matrix.script }}; then exit 0; fi
            echo "Attempt $i failed, trying again"; sleep 10
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Make the Mac download (the installer and the read-me in one zip)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          case "${{ matrix.script }}" in
            *arm64) A=arm64; N=Apple-chip;;
            *) A=x64; N=Intel;;
          esac
          rm -rf pack && mkdir -p "pack/Presenter for Mac ($N)"
          cp "dist/Presenter-mac-$A.dmg" "pack/Presenter for Mac ($N)/"
          cp "build/Read me first.txt" "pack/Presenter for Mac ($N)/Read me first.txt"
          (cd pack && zip -r "../Presenter-Mac-$N.zip" .)
          gh release upload "${{ github.ref_name }}" "Presenter-Mac-$N.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the friendly setup and the zip people download (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        working-directory: desktop/presenter-installer/setup
        run: ./build.ps1 -Installer ../../presenter-app/dist/Presenter-Setup.exe -Zip -OutDir out
      - name: Attach the zip to the release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: gh release upload "${{ github.ref_name }}" desktop/presenter-installer/setup/out/Presenter-Windows-Setup.zip --clobber
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
