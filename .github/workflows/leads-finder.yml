name: IG Leads Finder app

# Runs the checks, builds the Windows installer and the Mac installers (Apple chip and Intel), and publishes them to a
# release called leads-vX.Y.Z and to a release called leads-latest (the download page links to leads-latest, so it never
# needs a new link). Never marked as the latest release, because the Presenter download uses "latest".
# Start it by pushing a tag such as leads-v1.2.0, or run it by hand from the Actions tab.
on:
  push:
    tags: ['leads-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: leads-v1.2.0

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Instagram Outreach Lead Generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: win
          - os: macos-latest
            label: mac-arm64
            arch: arm64
          - os: macos-15-intel
            label: mac-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Instagram Outreach Lead Generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller pillow
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
        working-directory: .
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $env:Path += ";C:\Program Files (x86)\NSIS"
          python build.py --out ../dist
      - name: Mac installers (pkg and dmg), tried up to three times because the disk image step is flaky
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for i in 1 2 3; do
            if python build_mac.py ${{ matrix.arch }}; then exit 0; fi
            echo "Attempt $i failed, trying again"; sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: leads-${{ matrix.label }}
          path: |
            dist/IG-Leads-Finder-Setup.exe
            Instagram Outreach Lead Generator/build_out/IG-Leads-Finder-mac-*.pkg
            Instagram Outreach Lead Generator/build_out/IG-Leads-Finder-mac-*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ls -la files
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "IG Leads Finder $TAG" --notes "IG Leads Finder for Windows and Mac." --latest=false
          gh release upload "$TAG" files/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view leads-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create leads-latest --repo "$GITHUB_REPOSITORY" --title "IG Leads Finder (newest version)" --notes "Always the newest IG Leads Finder. The download page links here." --latest=false
          gh release upload leads-latest files/* --repo "$GITHUB_REPOSITORY" --clobber
