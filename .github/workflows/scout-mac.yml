name: IG Scout for Mac

# Builds IG Scout for Mac (Apple chip and Intel) and adds the disk images to an existing IG Scout release.
# Run it by hand from the Actions tab (or with: gh workflow run scout-mac.yml -f tag=scout-v1.1.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to add the Mac files to
        default: scout-v1.1.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ig-scout/requirements.txt pyinstaller pillow
      - run: python ig-scout/build_mac.py ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: scout-mac-${{ matrix.arch }}
          path: ig-scout/build_out/IG-Scout-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la files
          gh release upload "${{ github.event.inputs.tag }}" files/* --repo "$GITHUB_REPOSITORY" --clobber
