@keyframes float{to{transform:translate(26px,-34px) rotate(60deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}.big .d span,.tag,h1,p,.links,.zero{opacity:1;transform:none}}

<script>
(function(){
  try{ document.getElementById('path').textContent = location.pathname + location.search; }catch(e){}
  /* suggest the closest real page, so a typo lands somewhere useful */
  var PAGES=[['/','the home page'],['/tools/','the free tools'],['/cv.html','my CV'],['/solutions.html','the solutions page'],['/full-stack-developer/','full stack developer for hire'],['/web-developer/','web developer in Lagos'],['/web-developer-kuwait/','web developer for Kuwait'],['/web-developer-uae/','web developer for the UAE'],['/tools/qr-code-generator/','the QR code generator'],['/tools/video-editor/','the video editor'],['/tools/video-compressor/','the video compressor'],['/tools/pdf-converter/','the PDF converter'],['/tools/image-converter/','the image converter'],['/tools/remove-background/','the background remover'],['/tools/whatsapp-link-generator/','the WhatsApp link generator'],['/tools/second-screen-presenter/','the Presenter app'],['/tools/audio-mastering/','audio mastering'],['/tools/screen-recorder/','the screen recorder']];
  function words(x){ return x.toLowerCase().replace(/\.html$/,'').split(/[\/\-_\s.]+/).filter(Boolean); }
  function lev(a,b){ var m=[],i,j; for(i=0;i<=a.length;i++){m[i]=[i];} for(j=0;j<=b.length;j++){m[0][j]=j;} for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return m[a.length][b.length]; }
  try{
    var want=words(location.pathname), best=null, bs=0;
    if(want.length){ PAGES.forEach(function(p){ var have=words(p[0]), sc=0; want.forEach(function(w){ have.forEach(function(h){ if(w===h) sc+=2; else if(w.length>3&&(h.indexOf(w)>-1||w.indexOf(h)>-1)) sc+=1.5; else if(w.length>3&&h.length>3&&lev(w,h)<=2) sc+=1.2; }); }); if(sc>bs){bs=sc;best=p;} }); }
    if(best&&bs>=1.2&&best[0]!==location.pathname){ var g=document.getElementById('guessLink'); g.href=best[0]; g.textContent=best[1]; document.getElementById('guess').hidden=false; }
  }catch(e){}
  var big=document.getElementById('big'), zero=document.getElementById('zero'), shapes=[].slice.call(document.querySelectorAll('.shape')), orbs=[].slice.call(document.querySelectorAll('.orb'));
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var tx=0,ty=0,cx=0,cy=0;
  addEventListener('pointermove',function(e){ tx=(e.clientX/innerWidth-.5); ty=(e.clientY/innerHeight-.5); },{passive:true});
  (function tick(){
    cx+=(tx-cx)*.07; cy+=(ty-cy)*.07;
    big.style.transform='rotateY('+(cx*16)+'deg) rotateX('+(-cy*12)+'deg)';
    zero.style.transform='translateZ(60px) translate('+(cx*18)+'px,'+(cy*14)+'px)';
    shapes.forEach(function(s,i){ var k=(i+1)*14; s.style.translate=(cx*k)+'px '+(cy*k)+'px'; });
    orbs.forEach(function(o,i){ var k=(i+1)*22; o.style.translate=(-cx*k)+'px '+(-cy*k)+'px'; });
    requestAnimationFrame(tick);
  })();
})();
</script>
